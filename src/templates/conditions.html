<h2>Weather Forecast</h2>

{% if forecasts %}
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Temperature</th>
                <th>Conditions</th>
            </tr>
        </thead>
        <tbody>
            {% for forecast in forecasts %}
            <tr>
                <td>{{ forecast.forecast_date }}</td>
                <td>{{ forecast.temperature }}°F</td>
                <td>{{ forecast.description }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% else %}
    <p>No forecasts available. Run the weather collector first.</p>
{% endif %}
